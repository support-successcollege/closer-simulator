<!doctype html>
<html lang="he" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable: capping zoom fails WCAG 1.4.4
         and the Israeli IS 5568 accessibility standard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>CLOSER Simulator — סימולטור אימון מכירות</title>
    <meta
      name="description"
      content="סימולטור אימון מכירות בעברית: תרגול גילוי צורך, טיפול בהתנגדויות, משא ומתן וסגירה — עם משוב מיידי ומעקב ביצועים." />
    <meta name="theme-color" content="#09090c" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <!-- Open Graph / social previews.
         No canonical or og:url yet: this app has no production domain.
         An absolute URL here would have to be guessed, and a guess that
         lands on someone else's site — closer-simulator.vercel.app is
         already taken by an unrelated project — hands them our canonical
         and our share previews. Add both once the real domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="CLOSER Simulator" />
    <meta property="og:title" content="CLOSER Simulator — סימולטור אימון מכירות" />
    <meta
      property="og:description"
      content="תרגול גילוי צורך, טיפול בהתנגדויות, משא ומתן וסגירה — עם משוב מיידי." />
    <meta name="twitter:card" content="summary" />

    <!-- Type system — see DESIGN.md §3.
         Rubik is a geometric Hebrew sans that carries headings with
         the confidence of a product mark; Heebo sets body and UI at
         the line height Hebrew needs; JetBrains Mono holds every
         figure, so timers and scores do not shift the layout as they
         count. No serif: a display serif used as body copy is what
         made the previous system tiring to read. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif">
        כדי להשתמש ב-CLOSER Simulator יש לאפשר JavaScript בדפדפן.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
